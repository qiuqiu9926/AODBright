name: Build AODBright

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install ldid dpkg xz

      - name: 安装 Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 编译打包
        run: |
          chmod +x layout/DEBIAN/postinst
          make package FINALPACKAGE=1

      - name: 收集产物
        run: |
          mkdir -p out/manual/DynamicLibraries
          cp packages/*.deb out/ 2>/dev/null || true
          find .theos/obj -name '*.dylib' -exec cp {} out/ \; 2>/dev/null || true
          cp AODBright.plist out/ 2>/dev/null || true
          # .theos/obj 里的是签名前的中间产物；deb 里的才是 ldid 签过名的。
          # 从 deb 里抽一份出来，供手工安装（免去再签一次也不会拿错）。
          dpkg-deb -x packages/*.deb out_deb/ 2>/dev/null || true
          cp out_deb/var/jb/Library/MobileSubstrate/DynamicLibraries/* out/manual/DynamicLibraries/ 2>/dev/null || true
          ls -l out/ out/manual/DynamicLibraries/

      - uses: actions/upload-artifact@v4
        with:
          name: AODBright
          path: out/