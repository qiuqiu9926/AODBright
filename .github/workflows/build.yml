name: Build AODBright

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install ldid dpkg xz

      - name: 安装 Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 编译打包
        run: make package FINALPACKAGE=1

      - name: 收集产物
        run: |
          mkdir -p out
          cp packages/*.deb out/ 2>/dev/null || true
          find .theos/obj -name '*.dylib' -exec cp {} out/ \; 2>/dev/null || true
          cp AODBright.plist out/ 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: AODBright
          path: out/